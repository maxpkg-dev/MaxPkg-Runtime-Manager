<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="panelGradient" x1="0" y1="0" x2="1" y2="1" color-interpolation="sRGB">
      <stop offset="0" stop-color="{{backgroundGradientTop}}"/>
      <stop offset="0.48" stop-color="{{surfaceSecondary}}"/>
      <stop offset="1" stop-color="{{backgroundGradientBottom}}"/>
    </linearGradient>
  </defs>
  <rect width="2400" height="1400" fill="url(#panelGradient)"/>
</svg>
